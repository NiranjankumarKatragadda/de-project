name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install google-cloud-bigquery google-cloud-storage google-cloud-pubsub requests pandas pyarrow pytest
      - name: Run tests
        run: python -m pytest
